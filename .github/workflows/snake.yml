name: generate-snake-animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ThisIszas
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#00E5FF&color_dots=#0A1B3D,#12345A,#1F5FA8,#2E9BFF,#4FC3FF
            dist/github-contribution-grid-snake-dark.svg?color_snake=#00E5FF&color_dots=#050B1A,#0A2A52,#124C8A,#2E9BFF,#4FC3FF
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
